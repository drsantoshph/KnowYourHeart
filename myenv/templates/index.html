<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Your Heart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow-y: auto;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Know Your Heart</h1>
        <form id="heartForm">
            <label for="age">Age (in days):</label>
            <input type="number" id="age" name="age" placeholder="Enter age in days" required>

            <label for="gender">Gender (0: Female, 1: Male):</label>
            <input type="number" id="gender" name="gender" placeholder="Enter gender" required>

            <label for="height">Height (cm):</label>
            <input type="number" id="height" name="height" placeholder="Enter height in cm" required>

            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" placeholder="Enter weight in kg" required>

            <label for="ap_hi">Systolic Blood Pressure (ap_hi):</label>
            <input type="number" id="ap_hi" name="ap_hi" placeholder="Enter systolic BP" required>

            <label for="ap_lo">Diastolic Blood Pressure (ap_lo):</label>
            <input type="number" id="ap_lo" name="ap_lo" placeholder="Enter diastolic BP" required>

            <label for="cholesterol">Cholesterol (1: Normal, 2: Above Normal, 3: Well Above Normal):</label>
            <input type="number" id="cholesterol" name="cholesterol" placeholder="Enter cholesterol level" required>

            <label for="gluc">Glucose Level (1: Normal, 2: Above Normal, 3: Well Above Normal):</label>
            <input type="number" id="gluc" name="gluc" placeholder="Enter glucose level" required>

            <label for="smoke">Smoking (0: No, 1: Yes):</label>
            <input type="number" id="smoke" name="smoke" placeholder="Do you smoke?" required>

            <label for="alco">Alcohol Intake (0: No, 1: Yes):</label>
            <input type="number" id="alco" name="alco" placeholder="Do you consume alcohol?" required>

            <label for="active">Physical Activity (0: No, 1: Yes):</label>
            <input type="number" id="active" name="active" placeholder="Are you physically active?" required>

            <label for="cardio">Cardio Disease (0: No, 1: Yes):</label>
            <input type="number" id="cardio" name="cardio" placeholder="Do you have cardio disease?" required>

            <label for="age_years">Age (in years):</label>
            <input type="number" id="age_years" name="age_years" placeholder="Enter age in years" required>

            <label for="bmi">BMI:</label>
            <input type="number" id="bmi" name="bmi" placeholder="Enter BMI" required>

            <button type="button" id="submit">Submit</button>
        </form>
        <p id="result"></p>
    </div>

    <script>
        document.getElementById('submit').addEventListener('click', async () => {
            const data = {
                features: [
                    parseFloat(document.getElementById('age').value),
                    parseFloat(document.getElementById('gender').value),
                    parseFloat(document.getElementById('height').value),
                    parseFloat(document.getElementById('weight').value),
                    parseFloat(document.getElementById('ap_hi').value),
                    parseFloat(document.getElementById('ap_lo').value),
                    parseFloat(document.getElementById('cholesterol').value),
                    parseFloat(document.getElementById('gluc').value),
                    parseFloat(document.getElementById('smoke').value),
                    parseFloat(document.getElementById('alco').value),
                    parseFloat(document.getElementById('active').value),
                    parseFloat(document.getElementById('cardio').value),
                    parseFloat(document.getElementById('age_years').value),
                    parseFloat(document.getElementById('bmi').value),
                ]
            };

            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                document.getElementById('result').textContent = `Prediction: ${result.prediction}`;
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
